<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Reference</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14232e;--mute:#5d7080;--line:#d5e0e7;--th:#0e4d5c;--th-ink:#fff;--zebra:#f5f9fb;--hover:#e3f2f5;--accent:#0e8aa3;--accent-ink:#fff;--ok:#0f7b4a;--okbg:#e5f6ec;--no:#b42318;--nobg:#fdecea;--mark:#ffe58a;--hero1:#0b3a47;--hero2:#0e8aa3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1419;--card:#142029;--ink:#e6eef3;--mute:#8da0ae;--line:#25343f;--th:#0b3a47;--zebra:#111b23;--hover:#183340;--accent:#37b7d0;--accent-ink:#06222a;--ok:#5fd39b;--okbg:#0f2a20;--no:#ff8a80;--nobg:#2e1715;--mark:#6b5a10;--hero1:#071f27;--hero2:#0a5566}}
:root[data-theme="dark"]{--bg:#0c1419;--card:#142029;--ink:#e6eef3;--mute:#8da0ae;--line:#25343f;--th:#0b3a47;--zebra:#111b23;--hover:#183340;--accent:#37b7d0;--accent-ink:#06222a;--ok:#5fd39b;--okbg:#0f2a20;--no:#ff8a80;--nobg:#2e1715;--mark:#6b5a10;--hero1:#071f27;--hero2:#0a5566}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:26px 16px 30px}
.in{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:30px;letter-spacing:.3px}
.sub{margin:2px 0 0;opacity:.85;font-size:13px}
.theme{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 12px;font-size:13px}
.sbox{position:relative;margin-top:18px}
.sbox input{width:100%;font:inherit;font-size:17px;padding:15px 44px 15px 18px;border:0;border-radius:12px;background:#fff;color:#14232e;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sbox button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#e3eef2;border:0;border-radius:50%;width:28px;height:28px;color:#14232e;font-size:16px;line-height:1}
.tabs{display:flex;gap:6px;margin-top:16px}
.tab{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:6px 16px;font-weight:600}
.tab[aria-selected="true"]{background:#fff;color:#0b3a47;border-color:#fff}
main{max-width:900px;margin:0 auto;padding:18px 16px 56px}
.banner{border-radius:12px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
.banner.ok{background:var(--okbg);border-color:var(--ok)}
.banner.no{background:var(--nobg);border-color:var(--no);color:var(--no);font-weight:700;font-size:19px}
.banner h2{margin:0;font-size:16px;color:var(--ok)}
.banner .jobs{margin-top:6px;font-size:22px;font-weight:800;color:var(--ink)}
.copy{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--mute);margin:0 0 8px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll{overflow:auto;max-height:68vh}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--th);color:var(--th-ink);text-align:left;padding:10px 12px;font-size:13px;white-space:nowrap;z-index:1}
td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr:hover{background:var(--hover)}
td.n{color:var(--mute);font-size:12px;width:1%}
td.job{font-weight:700;color:var(--accent)}
td.ref{white-space:normal;min-width:180px}
tr.hit td{box-shadow:inset 0 0 0 9999px rgba(15,123,74,.13)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.pg{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;border-top:1px solid var(--line);font-size:14px}
.pg button,.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
.pg button:disabled{opacity:.4;cursor:default}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
textarea{width:100%;min-height:150px;resize:vertical;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;border-radius:12px;padding:1px 10px;font-size:13px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--nobg);color:var(--no)}
.hide{display:none}
.credit{text-align:center;color:var(--mute);font-size:13px;padding:6px 16px 28px}.credit b{color:var(--accent)}
</style></head><body>

$('go').onclick=bulk;$('clr').onclick=()=>{$('bulk').value='';bulk();};
$('bres').addEventListener('click',e=>{
  if(e.target.id==='cp'){navigator.clipboard&&navigator.clipboard.writeText(last.map(x=>x.d+'\t'+x.j).join('\n'));e.target.textContent='Copied';}
  if(e.target.id==='dl'){const k=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const csv='Design,Status,Proposed Job\n'+last.map(x=>[k(x.d),x.f?'Found':'No record found',k(x.f?x.j:'')].join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='lab_reference_results.csv';a.click();}
});
function tab(n){$('p1').classList.toggle('hide',n!==1);$('p2').classList.toggle('hide',n!==2);
  $('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2);(n===1?$('q'):$('bulk')).focus();}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark';};
render();
</script></main><div class="credit">Design by <b>Sarfaraz</b></div></body></html>
